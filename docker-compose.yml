services:
  web:
    image: suchkovamaria/hw_35:latest
    working_dir: /app
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      HOST: db
      PORT: 5432
      NAME: ${NAME}
      USER: ${USER}
      PASSWORD: ${PASSWORD}
    networks:
      - foo

  db:
    image: postgres:16
    container_name: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    networks:
      - foo
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER} -d ${NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    env_file:
      - ./.env
    ports:
      - "6379:6379"
    networks:
      - foo
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    image: suchkovamaria/hw_35:latest
    command: celery -A config worker --loglevel=info -P eventlet
    working_dir: /app
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    networks:
      - foo
    restart: always

  celery-beat:
    image: suchkovamaria/hw_35:latest
    command: celery -A config beat --scheduler django --loglevel=info
    working_dir: /app
    depends_on:
      - db
      - redis
      - celery
    env_file:
      - ./.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings  # ← Добавить эту строку
      - PYTHONPATH=/app
    networks:
      - foo
    restart: always

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - foo

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  foo:
    driver: bridge