name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.2.1

      - name: Install flake8
        run: poetry add flake8

      - name: Run flake8
        run: poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.2.1

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root

      - name: Run test
        env:
          SECRET_KEY: 'test-secret-key-for-github-actions'
          LANGUAGE: 'ru'
          LC_ALL: 'ru_RU.UTF-8'
          CELERY_TASK_ALWAYS_EAGER: 'True'
        run: poetry run python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_NAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_NAME }}/hw_35:${{ github.sha }} -t ${{ secrets.DOCKER_HUB_NAME }}/hw_35:latest .

      - name: Push Docker image to Docker Hub
        run: docker push --all-tags ${{ secrets.DOCKER_HUB_NAME }}/hw_35

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP}}
          username: admin-vm1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/admin-vm1/app/"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP}}
          username: admin-vm1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/nginx.conf, nginx/Dockerfile"
          target: "/home/admin-vm1/app/"

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: admin-vm1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Создаем .env файл с ВСЕМИ переменными
            cat << 'EOF' > /home/admin-vm1/app/.env
            # Django
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.SERVER_IP }},localhost
            STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            

            # База данных (для Django settings.py)
            NAME=${{ secrets.DB_NAME }}
            USER=${{ secrets.DB_USER }}
            PASSWORD=${{ secrets.DB_PASSWORD }}
            HOST=db
            PORT=5432

            # Для PostgreSQL (он ожидает POSTGRES_*)
            POSTGRES_DB=${{ secrets.DB_NAME }}
            POSTGRES_USER=${{ secrets.DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}

            # Celery
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0

            # Docker Hub
            DOCKER_HUB_NAME=${{ secrets.DOCKER_HUB_NAME }}
            TAG=latest
            EOF

            # 2. Создаем директорию и переходим в нее
            mkdir -p /home/admin-vm1/app
            cd /home/admin-vm1/app

            # 4. Логин в Docker Hub
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_HUB_NAME }}" --password-stdin
            
            docker-compose pull
            
            # 5. Останавливаем старые контейнеры
            docker-compose down || true

            # 6. Запускаем все контейнеры
            docker-compose up -d

            # 7. Ждем запуска
            sleep 10

            # 8. Проверяем статус
            docker-compose ps

            # 9. Проверяем логи
            docker-compose logs web --tail 20

            # 10. Очистка
            docker image prune -f